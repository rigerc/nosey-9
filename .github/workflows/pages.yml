name: Registry site

# Builds the official registry browser (site/) and publishes it to GitHub Pages.
# Runs manually and as the last step of a release; never on ordinary pushes.
on:
  workflow_dispatch:
    inputs:
      latest_registry:
        description: "Build from the registry's current main instead of the revision pinned by registries/default"
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true
      - name: Move the registry to its main branch
        if: github.event_name == 'workflow_dispatch' && inputs.latest_registry
        run: git submodule update --init --remote registries/default
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test the site generator
        run: node --test site/test/*.test.mjs
      - name: Build site
        run: node site/build.mjs registries/default dist/site
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
