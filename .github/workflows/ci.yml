name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  # release.yml runs the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select applicable checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci-scope.sh
      - name: Set up Go
        if: steps.scope.outputs.go == 'true' || steps.scope.outputs.workflows == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # Rebuild the custom linter when its config or Go dependencies change.
      - name: Restore the custom linter
        if: steps.scope.outputs.go == 'true'
        id: custom-gcl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}
      - name: Install golangci-lint builder for anti-slop-go
        if: steps.scope.outputs.go == 'true' && steps.custom-gcl.outputs.cache-hit != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          install-only: true
      - name: Mark the cached linter as up to date for make
        if: steps.scope.outputs.go == 'true' && steps.custom-gcl.outputs.cache-hit == 'true'
        run: touch custom-gcl
      - name: Check formatting, go.mod/go.sum tidiness and lint
        if: steps.scope.outputs.go == 'true'
        run: make format-check tidy-check lint
      - name: Reject new high-severity advisories
        if: steps.scope.outputs.dependencies == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Scan reachable vulnerabilities
        if: steps.scope.outputs.go_dependencies == 'true'
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
      - name: Test CI check selection
        if: steps.scope.outputs.workflows == 'true'
        run: bash .github/scripts/ci-scope.test.sh
      - name: Validate workflows (actionlint)
        if: steps.scope.outputs.workflows == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
      - name: Scan workflows (zizmor)
        if: steps.scope.outputs.workflows == 'true'
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  test:
    name: Tests and integration
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select applicable checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci-scope.sh
      - name: Check out the official registry
        if: steps.scope.outputs.go == 'true'
        run: git submodule update --init registries/default
      - name: Set up Go
        if: steps.scope.outputs.go == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run race tests and coverage gates
        if: steps.scope.outputs.go == 'true'
        run: make test-coverage
      - name: Smoke-test the binary
        if: steps.scope.outputs.go == 'true'
        run: make smoke
      - name: Validate the official registry
        if: steps.scope.outputs.go == 'true'
        run: make registry-check
      - name: Check a new scaffold against its pinned generator
        if: steps.scope.outputs.go == 'true'
        run: make scaffold-check
      - name: Set up Node
        if: steps.scope.outputs.go == 'true' || steps.scope.outputs.upstream == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test the registry studio UI logic
        if: steps.scope.outputs.go == 'true'
        run: node --test internal/studio/testjs/*.test.mjs
      - name: Test both upstream CLI backends
        if: steps.scope.outputs.upstream == 'true'
        env:
          NOSEY_UPSTREAM_INTEGRATION: '1'
        run: |
          set -euo pipefail
          NOSEY_UPSTREAM_BACKEND=npx go test ./internal/installation -run '^TestUpstream' -count=1 -v
          npm install --global --ignore-scripts "skills@$(jq -r '.devDependencies.skills' tools/skills/package.json)"
          NOSEY_UPSTREAM_BACKEND=installed go test ./internal/installation -run '^TestUpstream' -count=1 -v
      - name: Verify the build is reproducible
        if: github.event_name != 'pull_request'
        run: make repro-check
      - name: Compile every release platform
        if: github.event_name != 'pull_request'
        run: make cross-build
      - name: Summarize coverage
        if: always() && steps.scope.outputs.go == 'true'
        run: |
          set -euo pipefail
          {
            echo '### Coverage'
            for profile in coverage.out core-coverage.out; do
              if [ -f "$profile" ]; then
                echo "- \`$profile\`: $(go tool cover -func="$profile" | tail -n 1 | awk '{print $NF}')"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profiles
        if: always() && steps.scope.outputs.go == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage.out
            core-coverage.out
          retention-days: 7
          if-no-files-found: ignore

  ci_result:
    name: CI result
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Applicable CI job finished with $result"; exit 1 ;;
            esac
          done
          echo 'All applicable CI checks passed.'
