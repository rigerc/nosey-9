name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
  # release.yml runs the same checks before it builds anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format, tidy and lint
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      # `golangci-lint custom` compiles the plugin linter on every run; reuse it
      # until .custom-gcl.yml (which pins both versions) changes.
      - name: Restore the custom linter
        id: custom-gcl
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.custom-gcl.yml', 'go.mod') }}
      - name: Install golangci-lint builder for anti-slop-go
        if: steps.custom-gcl.outputs.cache-hit != 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.15.0
          install-only: true
      - name: Mark the cached linter as up to date for make
        if: steps.custom-gcl.outputs.cache-hit == 'true'
        run: touch custom-gcl
      - name: Check formatting, go.mod/go.sum tidiness and lint
        run: make format-check tidy-check lint

  changes:
    name: Detect affected checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      upstream: ${{ steps.scope.outputs.upstream }}
      dependencies: ${{ steps.scope.outputs.dependencies }}
      go_dependencies: ${{ steps.scope.outputs.go_dependencies }}
      workflows: ${{ steps.scope.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks for changed files
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Materialize the diff so a git error fails the job and grep cannot
          # terminate git early (SIGPIPE under pipefail on large changes).
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          scope() {
            if grep -Eq "$2" "$RUNNER_TEMP/changed-files"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          build='^go\.(mod|sum)$|^Makefile$|^\.github/workflows/(ci|release)\.yml$'
          scope go "^(cmd|internal|tests|third_party|registries)/|^tools/skills/|^\.gitmodules$|^\.(golangci|custom-gcl)\.yml$|$build"
          scope upstream "^internal/(installation|process|settings|storage|contracts|domain|catalog|detection|registry|registrygen|gitpolicy)/|^tools/skills/|^third_party/|$build"
          scope dependencies '^go\.(mod|sum)$|(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json)$|^\.github/workflows/'
          scope go_dependencies '^go\.(mod|sum)$|^\.github/workflows/ci\.yml$'
          scope workflows '^\.github/|(^|/)action\.ya?ml$'

  test:
    name: Tests, coverage and smoke checks
    # Always runs on pushes to main, releases (workflow_call) and
    # manual runs; on pull requests only when the change can affect tests.
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: true # tests read the official registry
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run race tests and coverage gates
        run: make test-coverage
      - name: Smoke-test the binary
        run: make smoke
      - name: Validate the official registry
        run: make registry-check
      - name: Summarize coverage
        if: always()
        run: |
          set -euo pipefail
          {
            echo '### Coverage'
            for profile in coverage.out core-coverage.out; do
              if [ -f "$profile" ]; then
                echo "- \`$profile\`: $(go tool cover -func="$profile" | tail -n 1 | awk '{print $NF}')"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: |
            coverage.out
            core-coverage.out
          retention-days: 7
          if-no-files-found: ignore

  upstream:
    name: Real skills CLI (${{ matrix.backend }})
    # Exercises the launcher and the real pinned CLI in disposable projects.
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && (github.event_name != 'pull_request' || needs.changes.outputs.upstream == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [npx, installed]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the pinned CLI
        if: matrix.backend == 'installed'
        run: npm install --global --ignore-scripts "skills@$(jq -r '.devDependencies.skills' tools/skills/package.json)"
      - name: Run integration tests
        env:
          NOSEY_UPSTREAM_INTEGRATION: '1'
          NOSEY_UPSTREAM_BACKEND: ${{ matrix.backend }}
        run: go test ./internal/installation -run '^TestUpstream' -count=1 -v

  build:
    name: Build, smoke test and reproducibility
    if: github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build and smoke-test the binary
        run: make smoke
      - name: Verify the build is reproducible
        run: make repro-check
      - name: Compile every release platform
        run: make cross-build

  dependency_review:
    name: New dependency vulnerability review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject new high-severity advisories
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  vulnerability:
    name: Go vulnerability scan
    # Weekly, and on pull requests that change the dependency set. A failing
    # scheduled run notifies maintainers, unlike a log warning.
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.go_dependencies == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan reachable vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod

  workflow_security:
    name: GitHub Actions security
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'pull_request' && needs.changes.outputs.workflows == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Validate workflows (actionlint)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
      - name: Scan workflows (zizmor)
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: v1.32.0
          advanced-security: false
          min-severity: medium
          min-confidence: medium

  ci_result:
    name: CI result
    if: always()
    needs: [lint, changes, test, upstream, build, dependency_review, vulnerability, workflow_security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful applicable checks
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        shell: bash
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::Applicable CI job finished with $result"; exit 1 ;;
            esac
          done
          echo 'All applicable CI checks passed.'
