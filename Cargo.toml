[package]
name = "nosey"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Discover and manage agent skills for a workspace"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:rfd"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
globset = "0.4"
gpui-kit = { version = "=0.10.0", optional = true }
ignore = "0.4"
regex = "1"
jsonschema = { version = "0.46", default-features = false }
json5 = "1"
icu_collator = "2"
pathdiff = "0.2"
rfd = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3"
toml = "1"
flate2 = "1"
tar = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking","rustls-tls-native-roots","system-proxy"] }
walkdir = "2"

[profile.dev]
debug = 0
incremental = false

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }
