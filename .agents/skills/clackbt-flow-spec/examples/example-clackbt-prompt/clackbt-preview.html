<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>clackbt prompt preview — example-clackbt-prompt</title><style>body{font:16px system-ui,sans-serif;background:#101319;color:#e5e7eb;margin:0 auto;padding:32px;max-width:920px}h1{font-size:24px}p{color:#aab4c5}nav{display:flex;gap:8px;flex-wrap:wrap}button{background:#202a38;border:1px solid #516073;border-radius:8px;padding:9px 14px;color:#eee;cursor:pointer}button[aria-pressed="true"]{background:#3a5272}pre{font:15px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;border-radius:12px;background:#171e29;border:1px solid #526174;padding:24px;min-height:140px}@media(max-width:600px){body{padding:14px}pre{font-size:13px;padding:14px}}</style><h1>example-clackbt-prompt · clackbt transcript</h1><p>Spec-driven approximation. No Go application is executed; illustrations are not byte-for-byte terminal output.</p><nav id="tabs"></nav><pre id="screen" aria-live="polite"></pre><script>const G=["STAGE 1 — name (TextModel)\n◆  What should we call you?\n│  Ada ▌\n└\n\n","STAGE 2 — confirm (ConfirmModel)\n◇  What should we call you?\n│  Ada\n│\n◆  Create the greeting?\n│  ● Yes  ○ No\n└\n\n","COMPLETE\n◇  What should we call you?\n│  Ada\n│\n◇  Create the greeting?\n│  Yes\n│\n\n","CANCELLATION (illustrative)\n■  What should we call you?\n│  Cancelled\n└\n\nSynthetic transcript only; NOT runtime output, interaction testing, or exact ANSI/byte fidelity.\n"];const tabs=document.getElementById('tabs'),view=document.getElementById('screen');G.forEach((g,i)=>{let b=document.createElement('button');b.textContent=g.split('\n')[0];b.onclick=()=>{view.textContent=g;for(const x of tabs.children)x.setAttribute('aria-pressed',String(x===b))};tabs.append(b)});if(tabs.firstChild)tabs.firstChild.click();</script></html>
